apiVersion: apps/v1
kind: Deployment
metadata:
  name: equipment-booking-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: equipment-booking
  template:
    metadata:
      labels:
        app: equipment-booking
    spec:
      containers:
        - name: equipment-booking
          image: campus-equipment-booking:set-d
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: equipment-booking-service
spec:
  type: NodePort
  selector:
    app: equipment-booking
  ports:
    - port: 8080
      targetPort: 8080
